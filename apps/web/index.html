<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsApp Automation Platform</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f6f8;
    color: #17202a;
}

header {
    background: #075e54;
    color: white;
    padding: 22px;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 0 18px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap: 16px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 22px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.card h2 {
    margin-top: 0;
}

.status {
    display: inline-block;
    padding: 7px 12px;
    border-radius: 20px;
    background: #e8f5e9;
    color: #137333;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
    background: #075e54;
    color: white;
}
</style>
</head>

<body>

<header>
    <h1>WhatsApp Automation Platform</h1>
</header>

<div class="container">

    <div class="card">
        <h2>Platform Status</h2>
        <p>
            <span class="status" id="status">
                Checking...
            </span>
        </p>
    </div>

    <div class="grid">

        <div class="card">
            <h2>WhatsApp Accounts</h2>
            <p id="accounts">0</p>
            <button onclick="alert('Account management is being connected.')">
                Manage Accounts
            </button>
        </div>

        <div class="card">
            <h2>Messages</h2>
            <p id="messages">0</p>
            <button onclick="alert('Message inbox is being connected.')">
                Open Inbox
            </button>
        </div>

        <div class="card">
            <h2>Automation</h2>
            <p>Rules ready for configuration.</p>
            <button onclick="alert('Automation builder is being connected.')">
                Automation Rules
            </button>
        </div>

        <div class="card">
            <h2>Media</h2>
            <p>Media storage layer ready.</p>
            <button onclick="alert('Media manager is being connected.')">
                Media Manager
            </button>
        </div>

    </div>

</div>

<script>
async function check() {
    try {
        const response = await fetch("/api/health");
        const data = await response.json();

        document.getElementById("status").textContent =
            data.ok ? "Online" : "Offline";
    } catch {
        document.getElementById("status").textContent =
            "Offline";
    }
}

check();
</script>

</body>
</html>
