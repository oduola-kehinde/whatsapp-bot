<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WhatsApp Bot Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background:
                #f0f2f5;
            color: #111b21;
        }

        header {
            background: #075e54;
            color: white;
            padding: 18px 20px;
            box-shadow:
                0 2px 8px rgba(0,0,0,.15);
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header p {
            margin: 5px 0 0;
            opacity: .85;
        }

        main {
            width: 100%;
            max-width: 900px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 18px;

            box-shadow:
                0 2px 12px rgba(0,0,0,.08);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #999;
        }

        .dot.online {
            background: #25d366;
        }

        #qr {
            width: 280px;
            height: 280px;

            margin: 20px auto;

            display: flex;
            align-items: center;
            justify-content: center;

            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        #qr img {
            max-width: 100%;
            width: 100%;
            height: 100%;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;

            border: 1px solid #ccd0d5;
            border-radius: 8px;

            font-size: 15px;
            margin-bottom: 12px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button {
            border: 0;
            background: #128c7e;
            color: white;

            padding: 13px 20px;
            border-radius: 8px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: .9;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .info {
            line-height: 1.8;
        }

        .success {
            color: #128c7e;
            font-weight: bold;
        }

        .error {
            color: #d93025;
            font-weight: bold;
        }

        .muted {
            color: #667781;
        }

        @media(max-width:500px) {

            #qr {
                width: 250px;
                height: 250px;
            }

            .card {
                padding: 16px;
            }
        }

    </style>
</head>

<body>

<header>
    <h1>WhatsApp Bot</h1>
    <p>WhatsApp Web Bot Dashboard</p>
</header>

<main>

    <section class="card">

        <div class="status">

            <span
                id="dot"
                class="dot"
            ></span>

            <span id="status">
                Connecting...
            </span>

        </div>

        <div
            id="account"
            class="info muted"
        >
            Waiting for WhatsApp...
        </div>

    </section>

    <section
        id="qrCard"
        class="card"
    >

        <h2>Connect WhatsApp</h2>

        <p class="muted">
            Open WhatsApp on your phone,
            choose Linked Devices,
            then scan this QR code.
        </p>

        <div id="qr">
            Waiting for QR code...
        </div>

    </section>

    <section class="card">

        <h2>Send Message</h2>

        <p class="muted">
            Use international format.
            Example: 2348012345678
        </p>

        <input
            id="number"
            type="text"
            placeholder="2348012345678"
        >

        <textarea
            id="message"
            placeholder="Type your message..."
        ></textarea>

        <button
            id="sendButton"
            onclick="sendMessage()"
        >
            Send Message
        </button>

        <p id="sendResult"></p>

    </section>

</main>

<script>

let botReady = false;

async function updateStatus() {

    try {

        const response =
            await fetch("/api/status");

        const data =
            await response.json();

        botReady = data.ready;

        const status =
            document.getElementById("status");

        const dot =
            document.getElementById("dot");

        const qr =
            document.getElementById("qr");

        const qrCard =
            document.getElementById("qrCard");

        const account =
            document.getElementById("account");

        if (data.ready) {

            status.innerText =
                "Connected";

            status.className =
                "success";

            dot.className =
                "dot online";

            qr.innerHTML =
                "<strong>WhatsApp Connected</strong>";

            qrCard.querySelector("h2")
                .innerText =
                "WhatsApp Connected";

            if (data.info) {

                account.innerHTML =
                    "Account: " +
                    (data.info.pushname || "Unknown") +
                    "<br>" +
                    "Number: " +
                    (data.info.wid || "Unknown") +
                    "<br>" +
                    "Platform: " +
                    (data.info.platform || "Unknown");
            }

        }
        else {

            dot.className =
                "dot";

            status.className = "";

            status.innerText =
                data.state || "Connecting...";

            account.innerText =
                "WhatsApp is waiting for connection.";

            if (data.qr) {

                qr.innerHTML =
                    "<img src='" +
                    data.qr +
                    "' alt='WhatsApp QR Code'>";

            }
            else {

                qr.innerHTML =
                    "Generating QR code...";

            }
        }

    }
    catch (error) {

        document.getElementById("status")
            .innerText =
            "Server unavailable";

    }
}

async function sendMessage() {

    const number =
        document.getElementById("number")
            .value.trim();

    const message =
        document.getElementById("message")
            .value.trim();

    const result =
        document.getElementById("sendResult");

    const button =
        document.getElementById("sendButton");

    if (!number || !message) {

        result.className = "error";

        result.innerText =
            "Enter a phone number and message.";

        return;
    }

    if (!botReady) {

        result.className = "error";

        result.innerText =
            "WhatsApp is not connected yet.";

        return;
    }

    button.disabled = true;

    result.className = "";

    result.innerText =
        "Sending...";

    try {

        const response =
            await fetch("/api/send", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    number,
                    message
                })
            });

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Message failed"
            );
        }

        result.className =
            "success";

        result.innerText =
            "Message sent successfully.";

        document.getElementById("message")
            .value = "";

    }
    catch (error) {

        result.className =
            "error";

        result.innerText =
            error.message;

    }
    finally {

        button.disabled = false;

    }
}

updateStatus();

setInterval(
    updateStatus,
    2000
);

</script>

</body>
</html>
